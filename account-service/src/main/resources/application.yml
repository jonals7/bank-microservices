server:
  port: 8081

spring:
  application:
    name: account-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accountdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 10

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.bank: DEBUG
    org.springframework.r2dbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# URL of customer-service - uses env var in Docker, localhost for local dev
customers:
  service:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8080}